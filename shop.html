<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<div id="header-placeholder"></div>

<div class="ss-page-header py-4">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Shop</li>
      </ol>
    </nav>
    <h2 class="mb-0">Shop All Products</h2>
  </div>
</div>

<div class="container section-pad">
  <div class="row g-4">
    <!-- Filters -->
    <div class="col-lg-3">
      <div class="filter-panel mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0">Filters</h6>
          <button class="btn btn-sm btn-outline-ink" id="clearFiltersBtn">Clear</button>
        </div>

        <label for="shopSearchInput" class="form-label fw-semibold small">Search Products</label>
        <input type="search" id="shopSearchInput" class="form-control mb-4" placeholder="Search...">

        <h6 class="small text-uppercase text-muted mb-2">Category</h6>
        <div id="categoryFilterList" class="mb-4 d-grid gap-1"></div>

        <h6 class="small text-uppercase text-muted mb-2">Price up to</h6>
        <input type="range" class="form-range mb-1" id="priceRange" min="500" max="30000" step="500" value="30000">
        <div class="d-flex justify-content-between small text-muted mb-4">
          <span>₹500</span>
          <span id="priceRangeValue">₹30,000</span>
        </div>

        <h6 class="small text-uppercase text-muted mb-2">Minimum Rating</h6>
        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input rating-filter" type="radio" name="ratingFilter" id="ratingAny" value="0" checked>
            <label class="form-check-label" for="ratingAny">Any rating</label>
          </div>
          <div class="form-check">
            <input class="form-check-input rating-filter" type="radio" name="ratingFilter" id="rating4" value="4">
            <label class="form-check-label" for="rating4">4★ &amp; up</label>
          </div>
          <div class="form-check">
            <input class="form-check-input rating-filter" type="radio" name="ratingFilter" id="rating45" value="4.5">
            <label class="form-check-label" for="rating45">4.5★ &amp; up</label>
          </div>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="dealsOnlyFilter">
          <label class="form-check-label fw-semibold" for="dealsOnlyFilter">Deals only</label>
        </div>
      </div>
    </div>

    <!-- Product grid -->
    <div class="col-lg-9">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <span class="text-muted small" id="shopResultCount">0 products found</span>
        <div class="d-flex align-items-center gap-2">
          <label for="sortSelect" class="small text-muted mb-0">Sort by</label>
          <select id="sortSelect" class="form-select form-select-sm" style="width:auto;">
            <option value="default">Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Rating</option>
            <option value="newest">Newest</option>
            <option value="popular">Popular</option>
          </select>
        </div>
      </div>

      <div class="row g-4" id="shopGrid"></div>

      <div id="shopNoResults" class="empty-state d-none">
        <i class="bi bi-search"></i>
        <h5 class="mt-3">No products found</h5>
        <p class="text-muted">Try adjusting your filters or search term.</p>
        <button class="btn btn-coral" onclick="document.getElementById('clearFiltersBtn').click()">Clear Filters</button>
      </div>

      <nav class="mt-4" aria-label="Product pagination">
        <ul class="pagination justify-content-center" id="shopPagination"></ul>
      </nav>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<button id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
