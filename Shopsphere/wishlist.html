<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="wishlist">

<div id="header-placeholder"></div>

<div class="ss-page-header py-4">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
      </ol>
    </nav>
    <h2 class="mb-0">Your Wishlist</h2>
  </div>
</div>

<div class="container section-pad">
  <div class="row g-4" id="wishlistGrid"></div>

  <div id="wishlistEmpty" class="empty-state d-none">
    <i class="bi bi-heart"></i>
    <h5 class="mt-3">Your wishlist is empty</h5>
    <p class="text-muted">Save items you love to find them here later.</p>
    <a href="shop.html" class="btn btn-coral"><i class="bi bi-bag me-2"></i>Explore Products</a>
  </div>
</div>

<div id="footer-placeholder"></div>

<button id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/wishlist.js"></script>
</body>
</html>
