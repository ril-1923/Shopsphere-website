<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<div id="header-placeholder"></div>

<div class="ss-page-header py-3">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item"><a href="shop.html" class="text-decoration-none">Shop</a></li>
        <li class="breadcrumb-item"><a id="breadcrumbCategory" href="#" class="text-decoration-none">Category</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="breadcrumbName">Product</li>
      </ol>
    </nav>
  </div>
</div>

<div class="container section-pad" id="pdContent">
  <div class="row g-5">
    <!-- Gallery -->
    <div class="col-lg-6">
      <div class="pd-thumb-main mb-3">
        <img id="pdMainImage" src="" alt="Product image">
      </div>
      <div class="row g-2" id="pdThumbs"></div>
    </div>

    <!-- Info -->
    <div class="col-lg-6">
      <h1 class="h3 mb-2" id="pdName">Product name</h1>
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="stars" id="pdRatingStars"></span>
        <span class="text-muted small" id="pdReviewCount"></span>
        <span class="divider-dot"></span>
        <span class="small text-muted" id="pdRatingValue"></span>
      </div>

      <div class="d-flex align-items-center gap-3 mb-3">
        <span class="product-price fs-3" id="pdPrice"></span>
        <span class="product-oldprice fs-5" id="pdOldPrice"></span>
        <span class="badge-discount d-inline-block" id="pdDiscountBadge" style="position:static;"></span>
      </div>

      <p class="mb-3" id="pdStock"></p>

      <p class="text-ink-soft mb-4" id="pdDescription"></p>

      <div class="mb-4" id="pdColorSection">
        <h6 class="fw-semibold mb-2">Color</h6>
        <div id="pdColors" class="d-flex gap-2"></div>
      </div>

      <div class="mb-4" id="pdSizeSection">
        <h6 class="fw-semibold mb-2">Size</h6>
        <div id="pdSizes" class="d-flex gap-2 flex-wrap"></div>
      </div>

      <div class="mb-4">
        <h6 class="fw-semibold mb-2">Quantity</h6>
        <div class="qty-control">
          <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
          <input type="text" id="qtyInput" value="1" readonly aria-label="Quantity">
          <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-coral btn-lg px-4" id="addToCartBtn"><i class="bi bi-bag-plus me-2"></i>Add to Cart</button>
        <button class="btn btn-ink btn-lg px-4" id="buyNowBtn"><i class="bi bi-lightning-charge me-2"></i>Buy Now</button>
        <button class="btn btn-outline-ink btn-lg px-4" id="wishlistBtn"><i class="bi bi-heart me-2"></i>Add to Wishlist</button>
      </div>
    </div>
  </div>

  <!-- Tabs: description / specs / reviews -->
  <div class="mt-5">
    <ul class="nav nav-tabs" id="pdTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-desc" type="button">Description</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-specs" type="button">Specifications</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-reviews" type="button">Reviews</button>
      </li>
    </ul>
    <div class="tab-content border border-top-0 rounded-bottom-3 p-4 bg-white">
      <div class="tab-pane fade show active" id="tab-desc"><p id="pdSpecDescription" class="mb-0 text-ink-soft"></p></div>
      <div class="tab-pane fade" id="tab-specs">
        <table class="table table-sm">
          <tbody id="pdSpecsTable"></tbody>
        </table>
      </div>
      <div class="tab-pane fade" id="tab-reviews">
        <div id="pdReviewsList"></div>
      </div>
    </div>
  </div>

  <!-- Related products -->
  <div class="mt-5">
    <h4 class="mb-4">Related Products</h4>
    <div class="row g-4" id="relatedProductsGrid"></div>
  </div>
</div>

<div id="footer-placeholder"></div>

<button id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/product-details.js"></script>
</body>
</html>
