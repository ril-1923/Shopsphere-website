<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<div id="header-placeholder"></div>

<div class="ss-page-header py-4">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Cart</li>
      </ol>
    </nav>
    <h2 class="mb-0">Your Shopping Cart</h2>
  </div>
</div>

<div class="container section-pad">
  <div class="row g-4">
    <div class="col-lg-8">
      <div id="cartList"></div>

      <div id="cartEmpty" class="empty-state d-none">
        <i class="bi bi-bag-x"></i>
        <h5 class="mt-3">Your cart is empty</h5>
        <p class="text-muted">Looks like you haven't added anything yet.</p>
        <a href="shop.html" class="btn btn-coral"><i class="bi bi-bag me-2"></i>Continue Shopping</a>
      </div>

      <a href="shop.html" class="btn btn-outline-ink mt-2"><i class="bi bi-arrow-left me-2"></i>Continue Shopping</a>
    </div>

    <div class="col-lg-4" id="cartSummaryWrap">
      <div class="summary-card p-4">
        <h5 class="mb-3">Order Summary</h5>

        <form id="couponForm" class="input-group mb-3">
          <input type="text" class="form-control" id="couponInput" placeholder="Coupon code (try SAVE10)">
          <button class="btn btn-outline-ink" type="submit">Apply</button>
        </form>
        <div class="small text-teal mb-3" id="couponAppliedNote"></div>

        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Subtotal</span><span id="sumSubtotal">₹0</span></div>
        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Discount</span><span id="sumDiscount" class="text-teal">-₹0</span></div>
        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Shipping</span><span id="sumShipping">₹0</span></div>
        <div class="d-flex justify-content-between mb-3"><span class="text-muted">Tax (5%)</span><span id="sumTax">₹0</span></div>
        <hr>
        <div class="d-flex justify-content-between fs-5 fw-bold mb-4"><span>Total</span><span id="sumTotal">₹0</span></div>

        <a href="checkout.html" class="btn btn-coral btn-lg w-100"><i class="bi bi-lock me-2"></i>Proceed to Checkout</a>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<button id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
